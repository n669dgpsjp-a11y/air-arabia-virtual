<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manager Login | Air Arabia</title><link rel="icon" href="assets/logo-bird.webp"><link rel="stylesheet" href="styles.css"></head><body><div class="legal-strip">UNOFFICIAL FAN-MADE ROBLOX AIRLINE · NOT AFFILIATED WITH AIR ARABIA PJSC</div><header class="site-header"><a class="logo-link" href="index.html"><img src="assets/logo-wordmark.webp" alt="Air Arabia"></a><div class="header-actions" style="margin-left:auto"><a class="manager-link" href="index.html">Back to website</a></div></header><main class="auth-wrap"><section class="auth-card"><img src="assets/logo-wordmark.webp" alt="Air Arabia"><h1>Manager login</h1><p>Access flight scheduling, staffing, applications and news publishing.</p><form class="form-stack" id="managerLogin"><label><span class="form-label">Manager email</span><input class="form-control" id="managerEmail" type="email" required placeholder="name@airarabia.aero"></label><label><span class="form-label">Password</span><input class="form-control" id="managerPassword" type="password" required placeholder="••••••••"></label><button class="primary-btn" type="submit">Sign in</button><p class="helper-note">Prototype manager access only. Secure account authentication will be connected when the site moves to a backend.</p></form></section></main><script>document.getElementById('managerLogin').addEventListener('submit',e=>{e.preventDefault();sessionStorage.setItem('aa_manager','true');sessionStorage.setItem('aa_manager_email',document.getElementById('managerEmail').value);location.href='manager.html'});</script></body></html>
