<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in | Air Arabia</title><link rel="icon" href="assets/logo-bird.webp"><link rel="stylesheet" href="styles.css?v=4"><link rel="stylesheet" href="theme-overrides.css?v=4"></head><body><div class="legal-strip">UNOFFICIAL FAN-MADE ROBLOX AIRLINE · NOT AFFILIATED WITH AIR ARABIA PJSC</div><header class="site-header"><a class="logo-link" href="index.html"><img src="assets/logo-wordmark.webp" alt="Air Arabia"></a><div class="header-actions" style="margin-left:auto"><a class="manager-link" href="index.html">Back to website</a></div></header><main class="auth-wrap polished-auth"><section class="auth-card"><img src="assets/logo-wordmark.webp" alt="Air Arabia"><h1>Log in</h1><p>Sign in to manage operations, staffing, applications and news.</p><form class="form-stack" id="managerLogin" novalidate><label><span class="form-label">Username</span><input class="form-control" id="managerUsername" autocomplete="username" required></label><label><span class="form-label">Password</span><input class="form-control" id="managerPassword" type="password" autocomplete="current-password" required></label><button class="primary-btn" id="loginButton" type="submit">Log in</button><div class="form-message" id="loginMessage"></div></form></section></main><script>const API='https://hhfzzchoqibggtqvhkub.supabase.co/functions/v1/airline-api';const form=document.getElementById('managerLogin'),u=document.getElementById('managerUsername'),p=document.getElementById('managerPassword'),m=document.getElementById('loginMessage'),btn=document.getElementById('loginButton');form.addEventListener('submit',async e=>{e.preventDefault();e.stopPropagation();m.classList.remove('show');if(!u.value.trim()||!p.value){m.textContent='Enter your username and password.';m.classList.add('show');return}btn.disabled=true;btn.textContent='Logging in…';try{const r=await fetch(API+'?action=login',{method:'POST',mode:'cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value.trim(),password:p.value})});const d=await r.json();if(!r.ok||!d.token)throw Error(d.error||'Unable to log in');sessionStorage.setItem('aa_manager_token',d.token);sessionStorage.setItem('aa_manager_name',d.manager?.display_name||'Manager');window.location.replace('manager.html?v=4')}catch(err){m.textContent=err.message||'Unable to log in.';m.style.background='#fff0f2';m.style.color='#a41129';m.classList.add('show');btn.disabled=false;btn.textContent='Log in'}});</script></body></html>
