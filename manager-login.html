<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in | Air Arabia</title><link rel="icon" href="assets/logo-bird.webp"><link rel="stylesheet" href="styles.css?v=6"><link rel="stylesheet" href="theme-overrides.css?v=6"></head><body><a class="skip-link" href="#mainContent">Skip to main content</a><header class="site-header"><a class="logo-link" href="index.html" aria-label="Air Arabia home"><img src="assets/logo-wordmark.webp" alt="Air Arabia"></a><div class="header-actions" style="margin-left:auto"><a class="manager-link" href="index.html">Back to website</a></div></header><main class="auth-wrap polished-auth" id="mainContent"><section class="auth-card" aria-labelledby="loginTitle"><img src="assets/logo-wordmark.webp" alt="Air Arabia"><h1 id="loginTitle">Log in</h1><p>Team access for the unofficial fan project.</p><form class="form-stack" id="managerLogin" novalidate><label><span class="form-label">Username</span><input class="form-control" id="managerUsername" autocomplete="username" required aria-required="true"></label><label><span class="form-label">Password</span><input class="form-control" id="managerPassword" type="password" autocomplete="current-password" required aria-required="true"></label><button class="primary-btn" id="loginButton" type="submit">Log in</button><div class="form-message" id="loginMessage" role="status" aria-live="polite"></div></form></section></main><script>const API='https://hhfzzchoqibggtqvhkub.supabase.co/functions/v1/airline-api';const form=document.getElementById('managerLogin'),u=document.getElementById('managerUsername'),p=document.getElementById('managerPassword'),m=document.getElementById('loginMessage'),btn=document.getElementById('loginButton');form.addEventListener('submit',async e=>{e.preventDefault();m.classList.remove('show');if(!u.value.trim()||!p.value){m.textContent='Enter your username and password.';m.classList.add('show');(!u.value.trim()?u:p).focus();return}btn.disabled=true;btn.textContent='Logging in…';try{const r=await fetch(API+'?action=login',{method:'POST',mode:'cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value.trim(),password:p.value})});const d=await r.json();if(!r.ok||!d.token)throw Error(d.error||'Unable to log in');sessionStorage.setItem('aa_manager_token',d.token);sessionStorage.setItem('aa_manager_name',d.manager?.display_name||'Manager');window.location.replace('manager.html?v=6')}catch(err){m.textContent=err.message||'Unable to log in.';m.classList.add('show');btn.disabled=false;btn.textContent='Log in'}});</script></body></html>
