<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in | Air Arabia</title><link rel="icon" href="assets/logo-bird.webp"><link rel="stylesheet" href="styles.css"></head><body><div class="legal-strip">UNOFFICIAL FAN-MADE ROBLOX AIRLINE · NOT AFFILIATED WITH AIR ARABIA PJSC</div><header class="site-header"><a class="logo-link" href="index.html"><img src="assets/logo-wordmark.webp" alt="Air Arabia"></a><div class="header-actions" style="margin-left:auto"><a class="manager-link" href="index.html">Back to website</a></div></header><main class="auth-wrap"><section class="auth-card"><img src="assets/logo-wordmark.webp" alt="Air Arabia"><h1>Log in</h1><p>Sign in to manage operations, staffing, applications and news.</p><form class="form-stack" id="managerLogin"><label><span class="form-label">Username</span><input class="form-control" id="managerUsername" autocomplete="username" required></label><label><span class="form-label">Password</span><input class="form-control" id="managerPassword" type="password" autocomplete="current-password" required></label><button class="primary-btn" type="submit">Log in</button><div class="form-message" id="loginMessage"></div></form></section></main><script>const API='https://hhfzzchoqibggtqvhkub.supabase.co/functions/v1/airline-api';document.getElementById('managerLogin').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('loginMessage');m.classList.remove('show');try{const r=await fetch(API+'?action=login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:managerUsername.value,password:managerPassword.value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to log in');sessionStorage.setItem('aa_manager_token',d.token);sessionStorage.setItem('aa_manager_name',d.manager.display_name);location.href='manager.html'}catch(err){m.textContent=err.message;m.style.background='#fff0f2';m.style.color='#a41129';m.classList.add('show')}};</script></body></html>
