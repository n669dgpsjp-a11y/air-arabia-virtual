<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operations | Air Arabia</title><link rel="icon" href="assets/logo-bird.webp"><link rel="stylesheet" href="styles.css"></head><body><div class="legal-strip">TEAM OPERATIONS · UNOFFICIAL FAN-MADE PROJECT</div><header class="site-header"><a class="logo-link" href="index.html"><img src="assets/logo-wordmark.webp" alt="Air Arabia"></a><div class="header-actions" style="margin-left:auto"><a class="manager-link" href="index.html">View website</a><button class="manager-link" id="logoutBtn">Log out</button></div></header><main class="dashboard"><aside class="dashboard-side"><h2>Operations</h2><button class="dash-tab active" data-tab="flights">Flights</button><button class="dash-tab" data-tab="staffing">Staffing</button><button class="dash-tab" data-tab="applications">Applications</button><button class="dash-tab" data-tab="news">News</button><button class="dash-tab" data-tab="enquiries">Enquiries</button></aside><section class="dashboard-main"><div class="dash-head"><div><span class="section-kicker">OPERATIONS</span><h1>Dashboard</h1></div><small id="signedInAs"></small></div><div id="flights" class="tab-panel"><div class="dash-grid"><div class="panel"><h3>Schedule a flight</h3><form class="form-stack" id="flightForm"><label><span class="form-label">Flight number</span><input class="form-control" name="flight_number" placeholder="G9 601" required></label><div class="dash-grid"><label><span class="form-label">From</span><input class="form-control" name="origin" placeholder="SHJ" required></label><label><span class="form-label">To</span><input class="form-control" name="destination" placeholder="CAI" required></label></div><label><span class="form-label">Date</span><input class="form-control" name="flight_date" type="date" required></label><div class="dash-grid"><label><span class="form-label">Departure</span><input class="form-control" name="departure_time" type="time" required></label><label><span class="form-label">Arrival</span><input class="form-control" name="arrival_time" type="time" required></label></div><button class="primary-btn">Add departure</button></form></div><div class="panel"><h3>Scheduled flights</h3><div class="table-card"><table class="simple-table"><thead><tr><th>Flight</th><th>Route</th><th>Date</th><th>Time</th><th></th></tr></thead><tbody id="flightRows"></tbody></table></div></div></div></div><div id="staffing" class="tab-panel" hidden><div class="dash-grid"><div class="panel"><h3>Add team member</h3><form class="form-stack" id="staffForm"><input class="form-control" name="name" placeholder="Name" required><input class="form-control" name="role" placeholder="Role" required><input class="form-control" name="base" placeholder="Base" required><select class="form-control" name="status"><option>Active</option><option>Training</option><option>Inactive</option></select><textarea class="form-control" name="notes" placeholder="Notes"></textarea><button class="primary-btn">Add team member</button></form><h3 style="margin-top:28px">Publish vacancy</h3><form class="form-stack" id="jobForm"><input class="form-control" name="title" placeholder="Role title" required><select class="form-control" name="role"><option>Ground Crew</option><option>Cabin Crew</option><option>Flight Operations</option><option>Management</option><option>Customer Services</option></select><input class="form-control" name="base" placeholder="Base" required><textarea class="form-control" name="description" rows="4" placeholder="Job description" required></textarea><button class="primary-btn">Publish vacancy</button></form></div><div class="panel"><h3>Team</h3><div id="managerStaff"></div><h3 style="margin-top:28px">Vacancies</h3><div id="managerJobs"></div></div></div></div><div id="applications" class="tab-panel" hidden><div class="panel"><h3>Applications</h3><div id="applicationRows"></div></div></div><div id="news" class="tab-panel" hidden><div class="dash-grid"><div class="panel"><h3>Publish news</h3><form class="form-stack" id="newsForm"><input class="form-control" name="published_date" type="date" required><input class="form-control" name="title" placeholder="Headline" required><textarea class="form-control" name="summary" rows="4" placeholder="Summary" required></textarea><input class="form-control" name="image_url" placeholder="Image URL (optional)"><button class="primary-btn">Publish news</button></form></div><div class="panel"><h3>Published news</h3><div id="managerNews"></div></div></div></div><div id="enquiries" class="tab-panel" hidden><div class="panel"><h3>Contact enquiries</h3><div id="contactRows"></div></div></div></section></main><script src="manager.js"></script></body></html>
