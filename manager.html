<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operations | Air Arabia</title><link rel="icon" href="assets/logo-bird.webp"><link rel="stylesheet" href="styles.css?v=7"><link rel="stylesheet" href="theme-overrides.css?v=7"><style>.enquiry-tools{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:16px 0 22px}.enquiry-filters{display:flex;gap:8px;flex-wrap:wrap}.enquiry-filter{border:1px solid #e1e5e8;background:#fff;color:#263746;border-radius:999px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer}.enquiry-filter.active{background:#d71920;border-color:#d71920;color:#fff}.enquiry-filter .count{display:inline-flex;min-width:22px;height:22px;align-items:center;justify-content:center;margin-left:6px;padding:0 6px;border-radius:999px;background:rgba(0,0,0,.07);font-size:11px}.enquiry-filter.active .count{background:rgba(255,255,255,.2)}.enquiry-search{min-width:min(330px,100%);flex:1;max-width:420px}.enquiry-group{margin-top:24px}.enquiry-group-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}.enquiry-group-head h3{margin:0;font-size:18px}.enquiry-status-dot{width:9px;height:9px;border-radius:50%;background:#98a2aa}.enquiry-status-dot.unread{background:#d71920}.enquiry-status-dot.in-progress{background:#f0a11a}.enquiry-status-dot.resolved{background:#239766}.enquiry-results-note{font-size:13px;color:#697780;margin:0 0 8px}@media(max-width:650px){.enquiry-tools{align-items:stretch}.enquiry-search{max-width:none;min-width:100%}.enquiry-filters{width:100%}.enquiry-filter{flex:1}}</style></head><body><a class="skip-link" href="#dashboardMain">Skip to dashboard content</a><header class="site-header"><a class="logo-link" href="index.html" aria-label="Air Arabia home"><img src="assets/logo-wordmark.webp" alt="Air Arabia"></a><div class="header-actions" style="margin-left:auto"><a class="manager-link" href="index.html">View website</a><button class="manager-link" id="logoutBtn" type="button">Log out</button></div></header><main class="dashboard"><aside class="dashboard-side" aria-label="Operations sections"><h2>Operations</h2><div role="tablist" aria-label="Dashboard sections"><button class="dash-tab active" role="tab" aria-selected="true" aria-controls="flights" data-tab="flights">Flights</button><button class="dash-tab" role="tab" aria-selected="false" aria-controls="staffing" data-tab="staffing">Staffing</button><button class="dash-tab" role="tab" aria-selected="false" aria-controls="applications" data-tab="applications">Applications</button><button class="dash-tab" role="tab" aria-selected="false" aria-controls="news" data-tab="news">News</button><button class="dash-tab" role="tab" aria-selected="false" aria-controls="enquiries" data-tab="enquiries">Enquiries</button></div></aside><section class="dashboard-main" id="dashboardMain"><div class="dash-head"><div><span class="section-kicker">OPERATIONS</span><h1>Dashboard</h1></div><small id="signedInAs"></small></div><div id="flights" class="tab-panel" role="tabpanel"><div class="dash-grid"><div class="panel"><h2>Schedule a flight</h2><form class="form-stack" id="flightForm"><label><span class="form-label">Flight number</span><input class="form-control" name="flight_number" placeholder="G9 601" required></label><div class="dash-grid"><label><span class="form-label">From</span><input class="form-control" name="origin" placeholder="SHJ" required></label><label><span class="form-label">To</span><input class="form-control" name="destination" placeholder="CAI" required></label></div><label><span class="form-label">Date</span><input class="form-control" name="flight_date" type="date" required></label><div class="dash-grid"><label><span class="form-label">Departure time</span><input class="form-control" name="departure_time" type="time" required></label><label><span class="form-label">Arrival time</span><input class="form-control" name="arrival_time" type="time" required></label></div><button class="primary-btn" type="submit">Add departure</button></form></div><div class="panel"><h2>Scheduled flights</h2><div class="table-card"><table class="simple-table"><caption class="sr-only">Scheduled flights</caption><thead><tr><th scope="col">Flight</th><th scope="col">Route</th><th scope="col">Date</th><th scope="col">Time</th><th scope="col">Actions</th></tr></thead><tbody id="flightRows"></tbody></table></div></div></div></div><div id="staffing" class="tab-panel" role="tabpanel" hidden><div class="dash-grid"><div class="panel"><h2>Add team member</h2><form class="form-stack" id="staffForm"><label><span class="form-label">Name</span><input class="form-control" name="name" required></label><label><span class="form-label">Role</span><input class="form-control" name="role" required></label><label><span class="form-label">Base</span><input class="form-control" name="base" required></label><label><span class="form-label">Status</span><select class="form-control" name="status"><option>Active</option><option>Training</option><option>Inactive</option></select></label><label><span class="form-label">Notes</span><textarea class="form-control" name="notes"></textarea></label><button class="primary-btn" type="submit">Add team member</button></form><h2 style="margin-top:28px">Publish vacancy</h2><form class="form-stack" id="jobForm"><label><span class="form-label">Role title</span><input class="form-control" name="title" required></label><label><span class="form-label">Department</span><select class="form-control" name="role"><option>Ground Crew</option><option>Cabin Crew</option><option>Flight Operations</option><option>Management</option><option>Customer Services</option></select></label><label><span class="form-label">Base</span><input class="form-control" name="base" required></label><label><span class="form-label">Job description</span><textarea class="form-control" name="description" rows="4" required></textarea></label><button class="primary-btn" type="submit">Publish vacancy</button></form></div><div class="panel"><h2>Team</h2><div id="managerStaff" aria-live="polite"></div><h2 style="margin-top:28px">Vacancies</h2><div id="managerJobs" aria-live="polite"></div></div></div></div><div id="applications" class="tab-panel" role="tabpanel" hidden><div class="panel"><h2>Applications</h2><div id="applicationRows" aria-live="polite"></div></div></div><div id="news" class="tab-panel" role="tabpanel" hidden><div class="dash-grid"><div class="panel"><h2>Publish news</h2><form class="form-stack" id="newsForm"><label><span class="form-label">Publish date</span><input class="form-control" name="published_date" type="date" required></label><label><span class="form-label">Headline</span><input class="form-control" name="title" required></label><label><span class="form-label">Short summary</span><textarea class="form-control" name="summary" rows="3" required></textarea></label><label><span class="form-label">Full article</span><textarea class="form-control" name="content" rows="10" placeholder="Write the full article here. Use blank lines to separate paragraphs." required></textarea></label><label><span class="form-label">Image URL</span><input class="form-control" name="image_url" type="url" placeholder="Optional"></label><button class="primary-btn" type="submit">Publish news</button></form></div><div class="panel"><h2>Published news</h2><div id="managerNews" aria-live="polite"></div></div></div></div><div id="enquiries" class="tab-panel" role="tabpanel" hidden><div class="panel"><h2>Contact enquiries</h2><div class="enquiry-tools"><div class="enquiry-filters" role="group" aria-label="Filter enquiries by status"><button class="enquiry-filter active" type="button" data-enquiry-filter="Unread">Unread <span class="count" id="unreadCount">0</span></button><button class="enquiry-filter" type="button" data-enquiry-filter="In progress">In progress <span class="count" id="progressCount">0</span></button><button class="enquiry-filter" type="button" data-enquiry-filter="Resolved">Resolved <span class="count" id="resolvedCount">0</span></button><button class="enquiry-filter" type="button" data-enquiry-filter="All">All <span class="count" id="allCount">0</span></button></div><label class="enquiry-search"><span class="sr-only">Search enquiries</span><input class="form-control" id="enquirySearch" type="search" placeholder="Search name, email, subject or message…" autocomplete="off"></label></div><p class="enquiry-results-note" id="enquiryResultsNote" aria-live="polite"></p><div id="contactRows" aria-live="polite"></div></div></div></section></main><script src="manager.js?v=8"></script></body></html>
